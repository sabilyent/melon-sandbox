<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Melon Sandbox — Play</title>
  <meta name="description" content="Play Melon Sandbox — a free browser 2D ragdoll physics sandbox. Spawn, shoot, explode." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
/* ─── RESET ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0d0d0f;
  --surface: #14141a;
  --panel:   #1a1a24;
  --border:  rgba(255,255,255,0.08);
  --green:   #4ade80;
  --orange:  #fb923c;
  --red:     #f87171;
  --yellow:  #fbbf24;
  --cyan:    #22d3ee;
  --purple:  #a78bfa;
  --text:    #f0f0f5;
  --muted:   #8888aa;
  --font-px: 'Press Start 2P', monospace;
  --font-ui: 'Outfit', sans-serif;
  --tb-h:    48px;   /* top bar height desktop */
  --bb-h:    0px;    /* bottom bar height (set by JS/mobile) */
  --safe-b:  env(safe-area-inset-bottom, 0px);
  --safe-l:  env(safe-area-inset-left, 0px);
  --safe-r:  env(safe-area-inset-right, 0px);
}
html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui);
  touch-action:none; /* prevent browser scroll/zoom on canvas */
  -webkit-tap-highlight-color: transparent;
  user-select:none; -webkit-user-select:none;
}

/* ═══════════════════════════════════════════════════════════
   PORTRAIT LOCK OVERLAY
═══════════════════════════════════════════════════════════ */
#portrait-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: #0d0d1a;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.5rem; text-align: center;
  padding: 2rem;
}
#portrait-overlay .rotate-phone {
  font-size: 4rem;
  animation: rotateAnim 2s ease-in-out infinite;
}
@keyframes rotateAnim {
  0%,100% { transform: rotate(0deg); }
  40%      { transform: rotate(90deg); }
  60%      { transform: rotate(90deg); }
}
#portrait-overlay h2 {
  font-family: var(--font-px); font-size: 0.7rem;
  color: var(--green); letter-spacing: 0.1em;
  line-height: 1.8;
}
#portrait-overlay p  { color: var(--muted); font-size: 0.85rem; }
#portrait-overlay .bar {
  width: 60px; height: 3px;
  background: var(--green); border-radius: 2px;
  animation: barPulse 1.5s ease-in-out infinite;
}
@keyframes barPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* Portrait detection */
@media (orientation: portrait) {
  #portrait-overlay { display: flex; }
  #app               { display: none !important; }
}

/* ═══════════════════════════════════════════════════════════
   APP LAYOUT
═══════════════════════════════════════════════════════════ */
#app { display:flex; flex-direction:column; width:100%; height:100%; }

/* ═══════════════════════════════════════════════════════════
   TOP BAR — DESKTOP
═══════════════════════════════════════════════════════════ */
#topbar {
  display:flex; align-items:center; gap:0.4rem;
  padding:0 0.75rem; height:var(--tb-h); flex-shrink:0;
  background:rgba(20,20,26,0.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  z-index:50; overflow:hidden;
}
.topbar-logo {
  font-family:var(--font-px); font-size:0.48rem;
  color:var(--green); text-decoration:none;
  margin-right:0.25rem; white-space:nowrap;
  letter-spacing:0.04em; line-height:1.5;
}
.topbar-sep { width:1px; height:28px; background:var(--border); margin:0 0.2rem; flex-shrink:0; }
.tool-group { display:flex; gap:2px; align-items:center; }
.tool-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; width:42px; height:38px; flex-shrink:0;
  background:transparent; border:1px solid transparent;
  border-radius:6px; cursor:pointer; color:var(--muted);
  font-size:1.05rem; transition:all 0.15s;
  position:relative; -webkit-appearance:none;
}
.tool-btn span.lbl { font-size:0.36rem; font-family:var(--font-px); letter-spacing:0.02em; }
.tool-btn:hover  { background:rgba(255,255,255,0.06); border-color:var(--border); color:var(--text); }
.tool-btn.active { background:rgba(74,222,128,0.15); border-color:var(--green); color:var(--green); }
.tool-btn.danger:hover { border-color:var(--red);    color:var(--red);    background:rgba(248,113,113,0.1); }
.tool-btn.warn:hover   { border-color:var(--orange); color:var(--orange); background:rgba(251,146,60,0.1); }
.tool-btn.active.warn  { border-color:var(--orange); color:var(--orange); background:rgba(251,146,60,0.15); }
.tool-btn[title]:hover::after {
  content:attr(title); position:absolute; bottom:-28px; left:50%;
  transform:translateX(-50%); background:#222; color:#fff;
  font-size:0.6rem; padding:3px 7px; border-radius:4px;
  white-space:nowrap; pointer-events:none; z-index:99;
}
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:6px; flex-shrink:0; }
.home-btn {
  font-family:var(--font-px); font-size:0.42rem;
  padding:0.35rem 0.7rem; background:transparent;
  border:1px solid var(--border); border-radius:6px;
  color:var(--muted); cursor:pointer; text-decoration:none;
  transition:all 0.2s; white-space:nowrap;
}
.home-btn:hover { border-color:var(--green); color:var(--green); }

/* ═══════════════════════════════════════════════════════════
   MAIN AREA
═══════════════════════════════════════════════════════════ */
#main { display:flex; flex:1; overflow:hidden; min-height:0; }

/* ═══════════════════════════════════════════════════════════
   SIDE PALETTE — DESKTOP
═══════════════════════════════════════════════════════════ */
#palette {
  width:162px; flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.palette-tabs { display:flex; border-bottom:1px solid var(--border); }
.tab-btn {
  flex:1; padding:0.5rem 0; background:transparent;
  border:none; cursor:pointer; color:var(--muted);
  font-size:0.65rem; font-family:var(--font-ui); font-weight:600;
  transition:all 0.15s; border-bottom:2px solid transparent;
}
.tab-btn.active { color:var(--green); border-bottom-color:var(--green); }
.tab-btn:hover:not(.active) { color:var(--text); }
.palette-body { flex:1; overflow-y:auto; padding:0.4rem; }
.palette-body::-webkit-scrollbar { width:3px; }
.palette-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
.palette-section { display:none; }
.palette-section.active { display:block; }
.palette-item {
  display:flex; align-items:center; gap:0.45rem;
  padding:0.5rem 0.55rem; border-radius:8px;
  border:1px solid transparent; cursor:pointer;
  transition:all 0.12s; margin-bottom:3px;
  background:rgba(255,255,255,0.03);
  -webkit-tap-highlight-color:transparent;
}
.palette-item:active, .palette-item:hover { background:rgba(255,255,255,0.07); border-color:var(--border); }
.palette-item.selected { border-color:var(--green); background:rgba(74,222,128,0.1); }
.palette-item .emoji   { font-size:1.15rem; flex-shrink:0; }
.palette-item .item-name { font-size:0.7rem; font-weight:600; color:var(--text); line-height:1.2; }
.palette-color-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-left:auto; }
.palette-hint {
  padding:0.65rem; font-size:0.6rem; color:var(--muted);
  border-top:1px solid var(--border); line-height:1.7;
}

/* ═══════════════════════════════════════════════════════════
   CANVAS WRAP
═══════════════════════════════════════════════════════════ */
#canvas-wrap { flex:1; position:relative; overflow:hidden; min-width:0; }
#game-canvas { display:block; width:100%; height:100%; touch-action:none; }
#game-canvas.cursor-grab   { cursor:grab; }
#game-canvas.cursor-delete { cursor:cell; }
#game-canvas.cursor-push   { cursor:move; }

/* ═══════════════════════════════════════════════════════════
   PAUSE OVERLAY
═══════════════════════════════════════════════════════════ */
#pause-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.55);
  display:none; align-items:center; justify-content:center;
  z-index:20; backdrop-filter:blur(4px);
}
.pause-box {
  text-align:center; padding:2rem 3rem;
  background:rgba(26,26,36,0.95); border:1px solid rgba(74,222,128,0.3);
  border-radius:16px;
}
.pause-box h2 { font-family:var(--font-px); font-size:1.2rem; color:var(--green); margin-bottom:0.75rem; }
.pause-box p  { color:var(--muted); font-size:0.85rem; }
.pause-resume-btn {
  margin-top:1rem; padding:0.6rem 1.4rem;
  background:rgba(74,222,128,0.15); border:1px solid var(--green);
  border-radius:8px; color:var(--green); cursor:pointer;
  font-family:var(--font-px); font-size:0.5rem; letter-spacing:0.05em;
}

/* ═══════════════════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════════════════ */
#hud {
  position:absolute; bottom:0.6rem; left:50%; transform:translateX(-50%);
  display:flex; gap:0.75rem; align-items:center;
  background:rgba(14,14,20,0.82); border:1px solid var(--border);
  padding:0.3rem 0.9rem; border-radius:999px;
  font-size:0.65rem; color:var(--muted); pointer-events:none;
  backdrop-filter:blur(6px); white-space:nowrap;
}
#hud span { color:var(--text); }
#hud-slowmo { display:none; color:var(--cyan); }

#tip-bar {
  position:absolute; top:0.5rem; left:50%; transform:translateX(-50%);
  background:rgba(20,20,30,0.88); border:1px solid var(--border);
  padding:0.28rem 0.9rem; border-radius:999px;
  font-size:0.6rem; color:var(--muted); pointer-events:none;
  white-space:nowrap; backdrop-filter:blur(6px);
}
#slowmo-badge {
  position:absolute; top:0.5rem; right:0.75rem;
  background:rgba(34,211,238,0.15); border:1px solid var(--cyan);
  padding:0.28rem 0.6rem; border-radius:999px;
  font-family:var(--font-px); font-size:0.4rem; color:var(--cyan);
  display:none; letter-spacing:0.07em;
}

/* ─── Camera Controls (desktop only) ────── */
#controls-bar {
  position:absolute; bottom:0.75rem; right:0.75rem;
  display:flex; flex-direction:column; gap:5px; z-index:5;
}
.ctrl-btn {
  width:36px; height:36px; border-radius:8px;
  background:rgba(26,26,36,0.92); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:0.9rem; color:var(--muted);
  transition:all 0.15s;
}
.ctrl-btn:hover { border-color:var(--green); color:var(--green); background:rgba(74,222,128,0.1); }

/* ═══════════════════════════════════════════════════════════
   MOBILE — LANDSCAPE ONLY
   Hides desktop palette/topbar, shows mobile controls
═══════════════════════════════════════════════════════════ */
#mob-toolbar   { display:none; }
#mob-palette   { display:none; }
#mob-pal-btn   { display:none; }

/* Apply mobile layout when screen width < 1024px AND landscape */
@media (orientation:landscape) and (max-width:1023px) {

  /* Compact top bar */
  #topbar {
    height:40px;
    padding:0 0.5rem;
    gap:0.2rem;
  }
  .topbar-logo { font-size:0.38rem; margin-right:0.1rem; }
  .tool-btn    { width:36px; height:34px; font-size:0.95rem; }
  .tool-btn span.lbl { display:none; } /* hide text labels on mobile */
  .topbar-sep  { margin:0 0.1rem; }
  .home-btn    { font-size:0.36rem; padding:0.3rem 0.5rem; }

  /* Hide desktop side palette */
  #palette { display:none; }

  /* Hide desktop camera control buttons (we have mobile ones) */
  #controls-bar { display:none; }

  /* HUD: move up from bottom bar */
  #hud { bottom:calc(var(--mob-bb-h, 60px) + 0.5rem); font-size:0.58rem; gap:0.5rem; padding:0.25rem 0.7rem; }

  /* ── MOBILE BOTTOM TOOL BAR ── */
  #mob-toolbar {
    display:flex; align-items:center; justify-content:space-between;
    gap:3px; padding:4px 8px;
    padding-bottom:calc(4px + var(--safe-b));
    background:rgba(14,14,22,0.97);
    border-top:1px solid var(--border);
    flex-shrink:0; z-index:50;
    height:calc(56px + var(--safe-b));
  }
  .mob-group { display:flex; gap:3px; align-items:center; }
  .mob-btn {
    width:46px; height:46px; border-radius:10px;
    background:rgba(255,255,255,0.05); border:1.5px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.2rem; color:var(--muted);
    transition:background 0.12s, border-color 0.12s;
    -webkit-appearance:none; -webkit-tap-highlight-color:transparent;
    gap:1px;
  }
  .mob-btn span { font-size:0.3rem; font-family:var(--font-px); color:inherit; letter-spacing:0.02em; }
  .mob-btn:active    { transform:scale(0.92); }
  .mob-btn.active    { background:rgba(74,222,128,0.18); border-color:var(--green); color:var(--green); }
  .mob-btn.danger    { border-color:rgba(248,113,113,0.3); }
  .mob-btn.danger:active { background:rgba(248,113,113,0.15); border-color:var(--red); color:var(--red); }
  .mob-btn.warn      { border-color:rgba(251,146,60,0.3); }
  .mob-btn.warn:active   { background:rgba(251,146,60,0.15); border-color:var(--orange); color:var(--orange); }
  .mob-btn.accent    { border-color:rgba(34,211,238,0.3); }
  .mob-btn.accent:active { background:rgba(34,211,238,0.15); border-color:var(--cyan); color:var(--cyan); }
  .mob-divider { width:1px; height:32px; background:var(--border); margin:0 2px; }

  /* ── MOBILE ITEM DRAWER ── */
  #mob-pal-btn {
    display:flex; align-items:center; justify-content:center;
    position:absolute; left:50%; top:0;
    transform:translate(-50%, calc(-100% - 6px));
    background:rgba(26,26,36,0.96); border:1px solid var(--border);
    border-radius:999px; padding:0.3rem 1.1rem;
    font-size:0.6rem; font-family:var(--font-px);
    color:var(--green); cursor:pointer; letter-spacing:0.06em;
    white-space:nowrap; gap:0.4rem;
    backdrop-filter:blur(8px);
    z-index:55; transition:border-color 0.15s;
  }
  #mob-pal-btn.open { border-color:var(--green); background:rgba(74,222,128,0.1); }

  #mob-palette {
    display:block;
    position:absolute; left:0; right:0;
    bottom:calc(56px + var(--safe-b));
    background:rgba(14,14,22,0.97);
    border-top:1px solid var(--border);
    z-index:48;
    transform:translateY(100%);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
    overflow:hidden;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  #mob-palette.open { transform:translateY(0); }

  /* Tabs inside mobile palette */
  #mob-palette .mob-tabs {
    display:flex; border-bottom:1px solid var(--border);
    padding:0 0.5rem;
  }
  #mob-palette .mob-tab {
    flex:1; padding:0.5rem; background:transparent; border:none;
    color:var(--muted); font-size:0.75rem; font-weight:600; cursor:pointer;
    border-bottom:2px solid transparent; transition:all 0.12s;
  }
  #mob-palette .mob-tab.active { color:var(--green); border-bottom-color:var(--green); }

  /* Items grid: horizontal scroll rows */
  #mob-palette .mob-items {
    display:flex; flex-wrap:nowrap; gap:8px;
    padding:10px 10px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #mob-palette .mob-items::-webkit-scrollbar { display:none; }

  .mob-palette-item {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; min-width:64px; height:68px;
    background:rgba(255,255,255,0.04); border:1.5px solid var(--border);
    border-radius:12px; cursor:pointer; flex-shrink:0;
    padding:6px; transition:all 0.12s;
    -webkit-tap-highlight-color:transparent;
  }
  .mob-palette-item:active  { transform:scale(0.9); }
  .mob-palette-item.selected { border-color:var(--green); background:rgba(74,222,128,0.12); }
  .mob-palette-item .m-emoji { font-size:1.6rem; line-height:1; }
  .mob-palette-item .m-label { font-size:0.52rem; color:var(--muted); text-align:center; font-weight:600; }
  .mob-palette-item.selected .m-label { color:var(--green); }

  /* Tip bar on mobile */
  #tip-bar { font-size:0.52rem; padding:0.22rem 0.7rem; top:42px; }
  #slowmo-badge { top:42px; font-size:0.35rem; }
}

/* Smallest mobiles */
@media (orientation:landscape) and (max-height:380px) {
  .mob-btn { width:42px; height:40px; font-size:1.05rem; }
  #mob-toolbar { height:calc(48px + var(--safe-b)); }
  #mob-palette { bottom:calc(48px + var(--safe-b)); }
}
  </style>
</head>
<body>

<!-- ══ PORTRAIT LOCK OVERLAY ══════════════════════════════════════════════ -->
<div id="portrait-overlay">
  <div class="rotate-phone">📱</div>
  <div class="bar"></div>
  <h2>ROTATE YOUR<br>DEVICE</h2>
  <p>Melon Sandbox plays in<br><strong>landscape mode only</strong></p>
  <div class="bar"></div>
</div>

<!-- ══ MAIN APP ═══════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- ── TOP BAR ─────────────────────────────────────────────────────────── -->
  <nav id="topbar">
    <a href="index.html" class="topbar-logo">🍉 MELON<br>SANDBOX</a>
    <div class="topbar-sep"></div>

    <!-- Tools -->
    <div class="tool-group">
      <button class="tool-btn active" id="tool-grab"   title="Grab &amp; Drag (1)" onclick="selectTool('grab')">
        ✋ <span class="lbl">GRAB</span>
      </button>
      <button class="tool-btn" id="tool-spawn"  title="Spawn (2)" onclick="selectTool('spawn')">
        ➕ <span class="lbl">SPAWN</span>
      </button>
      <button class="tool-btn" id="tool-delete" title="Delete (3)" onclick="selectTool('delete')">
        🗑 <span class="lbl">DEL</span>
      </button>
      <button class="tool-btn" id="tool-push"   title="Push (4)" onclick="selectTool('push')">
        💨 <span class="lbl">PUSH</span>
      </button>
      <button class="tool-btn" id="tool-freeze" title="Freeze (5)" onclick="selectTool('freeze')">
        ❄ <span class="lbl">FREEZE</span>
      </button>
    </div>

    <div class="topbar-sep"></div>

    <!-- Sim controls -->
    <div class="tool-group">
      <button class="tool-btn" id="btn-pause" title="Pause (P)" onclick="togglePause()">
        ⏸ <span class="lbl">PAUSE</span>
      </button>
      <button class="tool-btn" id="btn-slow" title="Slow-Mo (S)" onclick="toggleSlowMo(this)">
        🐢 <span class="lbl">SLOW</span>
      </button>
      <button class="tool-btn" title="Gravity (G)" onclick="game._cycleGravity()">
        🌍 <span class="lbl">GRAV</span>
      </button>
      <button class="tool-btn warn" title="Detonate All (F)" onclick="game.detonateAll()">
        💣 <span class="lbl">BOOM</span>
      </button>
    </div>

    <div class="topbar-sep"></div>

    <!-- File controls -->
    <div class="tool-group">
      <button class="tool-btn" title="Undo (Ctrl+Z)" onclick="game.undo()">
        ↩ <span class="lbl">UNDO</span>
      </button>
      <button class="tool-btn" title="Save" onclick="game.save()">
        💾 <span class="lbl">SAVE</span>
      </button>
      <button class="tool-btn" title="Load" onclick="game.load()">
        📂 <span class="lbl">LOAD</span>
      </button>
      <button class="tool-btn danger" title="Clear All (Del)" onclick="game.clearAll()">
        🚫 <span class="lbl">CLEAR</span>
      </button>
    </div>

    <div class="topbar-right">
      <a href="index.html" class="home-btn">◀ HOME</a>
    </div>
  </nav>

  <!-- ── MAIN AREA ────────────────────────────────────────────────────────── -->
  <div id="main">

    <!-- Desktop side palette -->
    <aside id="palette">
      <div class="palette-tabs">
        <button class="tab-btn active" onclick="switchTab('characters',this)">👥</button>
        <button class="tab-btn"        onclick="switchTab('weapons',this)">🔫</button>
        <button class="tab-btn"        onclick="switchTab('props',this)">📦</button>
      </div>
      <div class="palette-body">
        <div class="palette-section active" id="tab-characters"></div>
        <div class="palette-section"        id="tab-weapons"></div>
        <div class="palette-section"        id="tab-props"></div>
      </div>
      <div class="palette-hint" id="palette-hint">
        Select an item, then<br>press <b>2</b> (Spawn)<br>and click the canvas.
      </div>
    </aside>

    <!-- Canvas wrap -->
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>

      <!-- Pause overlay -->
      <div id="pause-overlay">
        <div class="pause-box">
          <h2>⏸ PAUSED</h2>
          <p>Press <b>P</b> or tap Resume</p>
          <button class="pause-resume-btn" onclick="togglePause()">▶ RESUME</button>
        </div>
      </div>

      <!-- HUD -->
      <div id="hud">
        🍉 <span id="hud-fps">60 fps</span>
        · <span id="hud-entities">0</span>
        · <span id="hud-grav">↓ g</span>
        · <span id="hud-zoom">100%</span>
        <span id="hud-slowmo">🐢</span>
      </div>

      <!-- Tip bar -->
      <div id="tip-bar">
        🖱 Drag to grab &nbsp;|&nbsp; Scroll to zoom &nbsp;|&nbsp; Alt+drag to pan &nbsp;|&nbsp; Right-click to push
      </div>

      <!-- Slow-mo badge -->
      <div id="slowmo-badge">🐢 SLOW-MO</div>

      <!-- Desktop camera buttons -->
      <div id="controls-bar">
        <button class="ctrl-btn" title="Reset Camera (R)" onclick="game.camera.reset()">🔭</button>
        <button class="ctrl-btn" title="Zoom In"          onclick="game.camera.zoomAt(game.canvas.width/2,game.canvas.height/2,1.2)">➕</button>
        <button class="ctrl-btn" title="Zoom Out"         onclick="game.camera.zoomAt(game.canvas.width/2,game.canvas.height/2,1/1.2)">➖</button>
      </div>

      <!-- ── MOBILE ITEM DRAWER (inside canvas-wrap for positioning) ── -->
      <button id="mob-pal-btn" onclick="toggleMobilePalette()">
        🎮 ITEMS <span id="mob-sel-emoji"></span>
      </button>
      <div id="mob-palette">
        <div class="mob-tabs">
          <button class="mob-tab active" onclick="switchMobTab('characters',this)">👥 Characters</button>
          <button class="mob-tab"        onclick="switchMobTab('weapons',this)">🔫 Weapons</button>
          <button class="mob-tab"        onclick="switchMobTab('props',this)">📦 Props</button>
        </div>
        <div id="mob-items-wrap">
          <div class="mob-items" id="mob-tab-characters"></div>
          <div class="mob-items" id="mob-tab-weapons" style="display:none"></div>
          <div class="mob-items" id="mob-tab-props"   style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MOBILE BOTTOM TOOLBAR ─────────────────────────────────────────────── -->
  <div id="mob-toolbar">
    <!-- Tool group -->
    <div class="mob-group">
      <button class="mob-btn active" id="mob-tool-grab"   onclick="selectTool('grab')">✋<span>GRAB</span></button>
      <button class="mob-btn"        id="mob-tool-spawn"  onclick="selectTool('spawn')">➕<span>SPAWN</span></button>
      <button class="mob-btn"        id="mob-tool-delete" onclick="selectTool('delete')">🗑<span>DEL</span></button>
      <button class="mob-btn"        id="mob-tool-push"   onclick="selectTool('push')">💨<span>PUSH</span></button>
      <button class="mob-btn"        id="mob-tool-freeze" onclick="selectTool('freeze')">❄<span>FRZ</span></button>
    </div>

    <div class="mob-divider"></div>

    <!-- Sim group -->
    <div class="mob-group">
      <button class="mob-btn" id="mob-pause"  onclick="togglePause()">⏸<span>PAUSE</span></button>
      <button class="mob-btn accent" id="mob-slow"   onclick="toggleSlowMo(this)">🐢<span>SLOW</span></button>
      <button class="mob-btn" onclick="game._cycleGravity()">🌍<span>GRAV</span></button>
    </div>

    <div class="mob-divider"></div>

    <!-- Action group -->
    <div class="mob-group">
      <button class="mob-btn warn"   onclick="game.detonateAll()">💣<span>BOOM</span></button>
      <button class="mob-btn"        onclick="game.undo()">↩<span>UNDO</span></button>
      <button class="mob-btn danger" onclick="game.clearAll()">🚫<span>CLEAR</span></button>
    </div>
  </div>

</div><!-- #app -->

<!-- ─── SCRIPTS ───────────────────────────────────────────────────────────── -->
<script src="src/physics.js"></script>
<script src="src/entities.js"></script>
<script src="src/effects.js"></script>
<script src="src/game.js"></script>
<script>
'use strict';

// ── CANVAS RESIZE ─────────────────────────────────────────────────────────
const canvas = document.getElementById('game-canvas');
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); });

// ── SHARED ACTIONS ────────────────────────────────────────────────────────
function selectTool(tool) {
  game._selectTool(tool);
  // Sync both desktop + mobile tool buttons
  document.querySelectorAll('.tool-btn, .mob-btn[id^="mob-tool-"]')
    .forEach(b => b.classList.remove('active'));
  const dtBtn = document.getElementById('tool-' + tool);
  if (dtBtn) dtBtn.classList.add('active');
  const mbBtn = document.getElementById('mob-tool-' + tool);
  if (mbBtn) mbBtn.classList.add('active');
}

function togglePause() {
  game.world.paused = !game.world.paused;
  game._updatePauseUI();
  const po = document.getElementById('pause-overlay');
  if (po) po.style.display = game.world.paused ? 'flex' : 'none';
  ['btn-pause','mob-pause'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', game.world.paused);
  });
}

function toggleSlowMo(btn) {
  game.world.slowMo = !game.world.slowMo;
  btn.classList.toggle('active', game.world.slowMo);
  // Sync sibling button
  ['btn-slow','mob-slow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', game.world.slowMo);
  });
  const badge = document.getElementById('slowmo-badge');
  if (badge) badge.style.display = game.world.slowMo ? 'block' : 'none';
}

// ── DESKTOP PALETTE ───────────────────────────────────────────────────────
function buildPalette() {
  Object.entries(PALETTE).forEach(([tab, items]) => {
    const el = document.getElementById('tab-' + tab);
    if (!el) return;
    items.forEach(item => {
      const div = document.createElement('div');
      div.className   = 'palette-item';
      div.dataset.id  = item.id;
      div.innerHTML   = `
        <span class="emoji">${item.emoji}</span>
        <div><div class="item-name">${item.label}</div></div>
        <div class="palette-color-dot" style="background:${item.color}"></div>
      `;
      div.addEventListener('click', () => selectPaletteItem(item, div));
      el.appendChild(div);
    });
  });
}

function selectPaletteItem(item, el) {
  document.querySelectorAll('.palette-item, .mob-palette-item')
    .forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  game.selectedItem = item.id;
  game._selectTool('spawn');
  selectTool('spawn');

  // Sync mobile selected emoji display
  const emojiEl = document.getElementById('mob-sel-emoji');
  if (emojiEl) emojiEl.textContent = item.emoji;

  // Update desktop hint
  const hint = document.getElementById('palette-hint');
  if (hint) {
    const isWeapon = ['pistol','rifle','shotgun','rocket','flamethrower'].includes(item.id);
    const isExplosive = ['grenade','bomb','mine'].includes(item.id);
    if (isWeapon)    hint.innerHTML = `<b>${item.emoji} ${item.label}</b><br>Tap canvas to fire.<br>Aim at ragdolls!`;
    else if (isExplosive) hint.innerHTML = `<b>${item.emoji} ${item.label}</b><br>Tap to place.<br>${item.id==='bomb'?'Press F to detonate!':item.id==='grenade'?'Explodes in 3s!':'Proximity trigger!'}`;
    else hint.innerHTML = `<b>${item.emoji} ${item.label}</b><br>Tap canvas to spawn.`;
  }

  // Close mobile palette after selection
  const mobPal = document.getElementById('mob-palette');
  const mobBtn = document.getElementById('mob-pal-btn');
  if (mobPal && mobPal.classList.contains('open')) {
    mobPal.classList.remove('open');
    if (mobBtn) mobBtn.classList.remove('open');
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.palette-section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// ── MOBILE PALETTE ────────────────────────────────────────────────────────
function buildMobilePalette() {
  Object.entries(PALETTE).forEach(([tab, items]) => {
    const el = document.getElementById('mob-tab-' + tab);
    if (!el) return;
    items.forEach(item => {
      const div = document.createElement('div');
      div.className  = 'mob-palette-item';
      div.dataset.id = item.id;
      div.innerHTML  = `
        <span class="m-emoji">${item.emoji}</span>
        <span class="m-label">${item.label}</span>
      `;
      div.addEventListener('click', () => selectPaletteItem(item, div));
      el.appendChild(div);
    });
  });
}

function switchMobTab(tab, btn) {
  document.querySelectorAll('.mob-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#mob-items-wrap .mob-items')
    .forEach(s => s.style.display = 'none');
  const el = document.getElementById('mob-tab-' + tab);
  if (el) el.style.display = 'flex';
}

function toggleMobilePalette() {
  const pal = document.getElementById('mob-palette');
  const btn = document.getElementById('mob-pal-btn');
  pal.classList.toggle('open');
  btn.classList.toggle('open');
}

// Close mobile palette when tapping canvas
document.getElementById('game-canvas').addEventListener('touchstart', () => {
  const pal = document.getElementById('mob-palette');
  const btn = document.getElementById('mob-pal-btn');
  if (pal && pal.classList.contains('open')) {
    pal.classList.remove('open');
    if (btn) btn.classList.remove('open');
  }
}, { passive: true });

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); game.save(); }
  if (e.ctrlKey && e.key === 'o') { e.preventDefault(); game.load(); }
});

// ── MOBILE TIP BAR ────────────────────────────────────────────────────────
function updateTipBar() {
  const isMobile = window.innerWidth < 1024 && window.innerHeight < window.innerWidth;
  const el = document.getElementById('tip-bar');
  if (el && isMobile) {
    el.textContent = '👆 Tap to interact · 2-finger pan/zoom · Use toolbar below';
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────
buildPalette();
buildMobilePalette();
updateTipBar();
const game = new Game(canvas);

// Fade tip bar
setTimeout(() => {
  const tip = document.getElementById('tip-bar');
  if (tip) { tip.style.transition='opacity 1s'; tip.style.opacity='0'; }
}, 7000);

window.addEventListener('resize', updateTipBar);
</script>
</body>
</html>
